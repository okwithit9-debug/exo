model_id = "orcarouter/Qwen3.8-Flash-Next-Uncensored-MLX"
n_layers = 48
hidden_size = 2560
num_key_value_heads = 2
supports_tensor = true
tasks = ["TextGeneration"]
family = "qwen"
quantization = "4bit"
base_model = "Qwen3.8 Flash-Next Uncensored"
capabilities = ["text", "thinking", "thinking_toggle", "vision"]
reasoning_dialect = "post_last_user"
context_length = 262144
trust_remote_code = true
backends = ["MlxMetal", "MlxCuda", "MlxCpu"]
[storage_size]
in_bytes = 175019917312

# Primary EXO Flash-Next target. Architecture is
# Qwen4ExpForConditionalGeneration / model_type qwen4_exp (same as the
# official Flash-Next preview). Default 4-bit MLX weights live at the
# repo root (~163 GiB); 6-bit/ and 8-bit/ are not first-class EXO ids.
# Spark vLLM companion in this product family:
# orcarouter/Qwen3.8-Flash-Next-Uncensored-NVFP4 (not an EXO MLX card).
# Stock mlx_lm does not ship qwen4_exp (ml-explore/mlx-lm#1788).
# EXO constructs this pack via the mlx-vlm>=0.6.17 shim in
# src/exo/worker/engines/mlx/vendor/qwen4_exp.py until #1788 lands.
# Source: https://huggingface.co/orcarouter/Qwen3.8-Flash-Next-Uncensored-MLX
[sampling_defaults]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
repetition_penalty = 1.0
presence_penalty = 1.5

[sampling_defaults.non_thinking]
temperature = 0.7
top_p = 0.8
top_k = 20
min_p = 0.0
repetition_penalty = 1.0
presence_penalty = 1.5
