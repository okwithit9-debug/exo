model_id = "mlx-community/Qwen3.8-Flash-Next-4bit"
n_layers = 48
hidden_size = 2560
num_key_value_heads = 2
supports_tensor = true
tasks = ["TextGeneration"]
family = "qwen"
quantization = "4bit"
base_model = "Qwen3.8 Flash-Next"
capabilities = ["text", "thinking", "thinking_toggle", "vision"]
reasoning_dialect = "post_last_user"
context_length = 262144
trust_remote_code = true
backends = ["MlxMetal", "MlxCuda", "MlxCpu"]
[storage_size]
in_bytes = 111518894072

# Architecture is Qwen4ExpForConditionalGeneration / model_type qwen4_exp.
# Stock mlx_lm does not ship qwen4_exp (ml-explore/mlx-lm#1788). EXO will
# load packs that set config.json model_file when trust_remote_code is true.
# Typed Mac+Spark TP/PP for Qwen4Exp is TODO until mlx_lm vendors the module.
# Source: https://huggingface.co/mlx-community/Qwen3.8-Flash-Next-4bit
# Source: https://huggingface.co/Qwen/Qwen3.8-Flash-Next
[sampling_defaults]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
repetition_penalty = 1.0
presence_penalty = 1.5

[sampling_defaults.non_thinking]
temperature = 0.7
top_p = 0.8
top_k = 20
min_p = 0.0
repetition_penalty = 1.0
presence_penalty = 1.5
